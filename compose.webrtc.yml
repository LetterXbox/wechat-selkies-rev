services:
  wechat-selkies-rev:
    environment:
      - SELKIES_MODE=webrtc
      - SELKIES_ENABLE_DUAL_MODE=true
      - SELKIES_WEBRTC_PUBLIC_IP=${SELKIES_WEBRTC_PUBLIC_IP:-}
      - SELKIES_STUN_HOST=${SELKIES_STUN_HOST:-stun.l.google.com}
      - SELKIES_STUN_PORT=${SELKIES_STUN_PORT:-19302}
      - SELKIES_TURN_HOST=${SELKIES_TURN_HOST:-}
      - SELKIES_TURN_PORT=${SELKIES_TURN_PORT:-3478}
      - SELKIES_TURN_PROTOCOL=${SELKIES_TURN_PROTOCOL:-udp}
      - SELKIES_TURN_TLS=${SELKIES_TURN_TLS:-false}
      - SELKIES_TURN_SHARED_SECRET=${SELKIES_TURN_SHARED_SECRET:-}
