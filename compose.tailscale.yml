services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: wechat-selkies-tailscale
    hostname: ${TS_HOSTNAME:-wechat}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - wechat-rev-tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  wechat-selkies-rev:
    network_mode: "service:tailscale"
    ports: !reset []
    depends_on:
      - tailscale

volumes:
  wechat-rev-tailscale:
