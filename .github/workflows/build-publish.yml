name: Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rust-check:
    name: Rust fmt, clippy, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wechat-supervisor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/wechat-supervisor

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  verify-tos-image:
    name: Build amd64 image and verify zero Tencent binaries
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wechat-selkies-rev:ci-check
          build-args: |
            INSTALL_WECHAT_AT_BUILD=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert no WeChat binary or data is baked into the image
        run: |
          docker run --rm --entrypoint /bin/sh wechat-selkies-rev:ci-check -c '
            set -eu
            test ! -e /usr/bin/wechat
            test ! -d /opt/wechat
            test ! -e /usr/share/icons/hicolor/128x128/apps/wechat.png
            /usr/local/bin/wechat-supervisor --version
          '

  publish:
    name: Publish multi-arch GHCR image
    runs-on: ubuntu-latest
    needs: verify-tos-image
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_WECHAT_AT_BUILD=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
